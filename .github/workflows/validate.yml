name: Validate deployment
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==8.4.2
      - name: Obtain checksum-pinned ICM test binary
        run: |
          curl -fLsS https://github.com/rtk-ai/icm/releases/download/icm-v0.11.4/icm-x86_64-unknown-linux-gnu.tar.gz -o /tmp/icm.tar.gz
          echo '319e619e809cc80e033b56dfb7ec5977ad886d1a13f9db2ab82022a9ecaca376  /tmp/icm.tar.gz' | sha256sum -c -
          mkdir /tmp/icm
          tar -xzf /tmp/icm.tar.gz -C /tmp/icm
          find /tmp/icm -type f -name icm -exec chmod +x {} \;
          echo "ICM_BINARY=$(find /tmp/icm -type f -name icm | head -1)" >> "$GITHUB_ENV"
      - name: Application and real upstream integration tests
        run: python -m pytest -q
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Build Linux AMD64 image and verify ICM executable
        run: |
          docker build --target standard -t joweenflores/ai-context-nas:0.1.0-standard -f gateway/Dockerfile .
          docker build --target slim -t joweenflores/ai-context-nas:0.1.0-slim -f gateway/Dockerfile .
          docker build -t joweenflores/ai-context-tls:0.1.0 -f gateway/Caddy.Dockerfile .
          docker run --rm --network none joweenflores/ai-context-nas:0.1.0-slim icm --version
          docker run --rm --network none joweenflores/ai-context-nas:0.1.0-standard git --version
      - name: Start Compose and verify private HTTPS
        run: |
          python -m scripts.manage init --uid "$(id -u)" --gid "$(id -g)"
          python -m scripts.manage register --project smoke
          python -m scripts.manage client --name ci --projects smoke --write
          mkdir -p runtime/repositories/smoke/.secrets
          printf "def indexed_sentinel(): pass\n" > runtime/repositories/smoke/sample.py
          printf "def private_sentinel(): pass\n" > runtime/repositories/smoke/.secrets/private.py
          docker compose --profile operations run --rm --no-deps indexer python -m scripts.manage index --project smoke
          python -c "from gateway.core import ContextStore; from pathlib import Path; s=ContextStore(Path('runtime'),Path('config')); assert 'indexed_sentinel' in str(s.graph_query('smoke','indexed_sentinel',1,20)); assert 'private_sentinel' not in Path('runtime/graphs/smoke/graph.json').read_text()"
          docker compose up --no-build -d --wait --wait-timeout 90
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent --show-error --noproxy '*' --cacert runtime/tls/caddy/pki/authorities/local/root.crt --resolve context.nas.internal:8443:127.0.0.1 https://context.nas.internal:8443/health
          echo '127.0.0.1 context.nas.internal' | sudo tee -a /etc/hosts
          python -m scripts.smoke --project smoke --ca runtime/tls/caddy/pki/authorities/local/root.crt --credentials .secrets/ci.env
          docker compose restart gateway
          docker compose up --no-build -d --wait --wait-timeout 60
          python -m scripts.smoke --project smoke --ca runtime/tls/caddy/pki/authorities/local/root.crt --credentials .secrets/ci.env --recall-only
      - name: Verify standard runtime persistence
        run: |
          CONTEXT_VARIANT=standard docker compose up --no-build -d --wait --wait-timeout 90 gateway
          python -m scripts.smoke --project smoke --ca runtime/tls/caddy/pki/authorities/local/root.crt --credentials .secrets/ci.env --recall-only
      - name: Verify maintenance backup and staging restore
        run: |
          docker compose stop tls gateway
          docker compose --profile operations run --rm --no-deps maintenance python -m scripts.manage backup --destination /backups
          archive=$(basename "$(find backups -name 'context-*.tar.gz' | head -1)")
          docker compose --profile operations run --rm --no-deps maintenance python -m scripts.manage restore --archive "/backups/$archive" --target /data/recovery-check
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose --env-file .env.example logs --tail 50 || true
          docker compose --env-file .env.example down || true
